name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build FortniteEditInput.sln -c Release
      - name: Test
        run: dotnet test tests/EditInput.Core.Tests -c Release --no-build
      - name: Publish
        run: dotnet publish src/EditInput.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: FortniteEditInput-win-x64
          path: publish/FortniteEditInput.exe
